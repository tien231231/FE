<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
    
  </head>
  <body>
    <div class="container">
      <img src="b.png" alt="" />
        
      
      <div class="checkout">
        <div class="checkout_header">
  <h2>Checkout</h2>
  <span class="item_count">3 ITEMS</span>
</div>
        <div class="left_checkout">
          <div class="item_checkout">
            <img src="iphone15pro.jpeg" />
            <div class="item_infomation">
              <div class="item_info">
                <h3>Iphone 15 Pro</h3>
                <span>$15.99</span>
              </div>
              <div class="item_quantity">
                <span>x1</span>
                <span>X</span>
              </div>
            </div>
          </div>
          <div class="item_checkout">
            <img src="macbook.jpg" width="100" height="100" />
            <div class="item_infomation">
              <div class="item_info">
                <h3>Iphone 15 Pro</h3>
                <span>$15.99</span>
              </div>
              <div class="item_quantity">
                <span>x1</span>
                <span>X</span>
              </div>
            </div>
          </div>
          <div class="item_checkout">
            <img src="ipad.jpg" width="100" height="100" />
            <div class="item_infomation">
              <div class="item_info">
                <h3>Iphone 15 Pro</h3>
                <span>$15.99</span>
              </div>
              <div class="item_quantity">
                <span>x1</span>
                <span>X</span>
              </div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="coupon">
            <input class="coupon_input" type="text" placeholder="Enter your coupon" />
            <button class="coupon_button" > Apply Coupon</button>
          </div>
          <div class="sub_total">
            <span>Sub Total</span>
            <span>$2323</span>
          </div>
          <div class="Tax">
            <span>Tax</span>
            <span>$2323</span>
          </div>
          <div class="Total">
            <span>Total</span>
            <span>$2323</span>
          </div>
        </div>
        <div class="right_checkout">
  <h3>Contact Information</h3>

  <label for="fullname">First & Last name</label>
  <input type="text" id="fullname" placeholder="Enter first & last name">

  <label for="email">Email Address</label>
  <input type="email" id="email" placeholder="Enter email address">

  <label for="country">Country</label>
  <input type="text" id="country" placeholder="Finland">

  <button class="submit_btn">Thanh toán</button>
</div>
      </div>
    </div>
  </body>
</html>
